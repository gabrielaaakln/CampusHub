# local development only the database runs in docker
# api and web run from the terminal with npm run dev
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-campushub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campushub}
      POSTGRES_DB: ${DB_NAME:-campushub}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-campushub} -d ${DB_NAME:-campushub}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata-dev:
